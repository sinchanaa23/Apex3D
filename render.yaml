# Render Blueprint: New > Blueprint, pick this repository. Step-by-step guide: docs/DEPLOY_RENDER.md
services:
  - type: web
    name: apex3d
    runtime: docker
    dockerfilePath: ./Dockerfile
    # FREE PLAN (no card needed). Measured on the lean image's code: the server needs about 260 MB (peak 257 MB), against Render's 512 MB
    # (from memory, not checked). The free plan has no disk, so accounts are lost whenever the service restarts or wakes from sleep, and it
    # sleeps after about 15 minutes without visitors. This image has no TripoSR, so the 3D Studio shows the showcase car and says the mesh
    # builder isn't available. For a deployment that keeps accounts use a paid plan and restore the disk block below.
    plan: free
    healthCheckPath: /api/health
    # A deploy happens when you press Deploy, not on every push, so a teammate's broken commit can't take the live site down.
    autoDeploy: false
    envVars:
      - key: APEX3D_REQUIRE_LOGIN
        value: "1"
      - key: APEX3D_DISABLE_DOCS
        value: "1"
      # The free plan gives a small share of one CPU, so don't start more threads than that.
      - key: APEX3D_ORT_THREADS
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
    # Not allowed on the free plan. With a paid plan, add back:
    #   disk:
    #     name: apex3d-data
    #     mountPath: /app/backend/storage
    #     sizeGB: 1
