# Render Blueprint: New > Blueprint, pick this repository. See docs/DEPLOY_RENDER.md.
services:
  - type: web
    name: apex3d
    runtime: docker
    dockerfilePath: ./Dockerfile
    # FREE PLAN, chosen because a card isn't available. Limits (Render's, from memory): 512 MB of memory, a small share of one
    # CPU, sleeps after about 15 minutes idle, and no persistent disk. Measured on the real code: the server needs about
    # 330 to 580 MB with the models loaded and about 1.25 GB while building a 3D mesh, so on this plan the mesh builder will
    # run out of memory and the service will restart, and recognition itself may too. Accounts are lost on every restart.
    # For the full app use "standard" (2 GB) and restore the disk block below. See docs/DEPLOY_RENDER.md.
    plan: free
    healthCheckPath: /api/health
    # A deploy happens when you press Deploy, not on every push, so a teammate's broken commit can't take the live site down.
    autoDeploy: false
    envVars:
      - key: APEX3D_REQUIRE_LOGIN
        value: "1"
      - key: APEX3D_DISABLE_DOCS
        value: "1"
      # Telling PyTorch avoids it starting more threads than the CPU can run.
      - key: OMP_NUM_THREADS
        value: "1"
    # Not allowed on the free plan. With "standard", add back:
    #   disk:
    #     name: apex3d-data
    #     mountPath: /app/backend/storage
    #     sizeGB: 1
